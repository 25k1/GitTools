name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = ''
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}' -replace '^[vV]', ''
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up MSVC environment
        id: msvc
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vs) { throw 'No Visual Studio with the C++ toolset found' }

          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and
                [Environment]::GetEnvironmentVariable($Matches[1]) -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV
            }
          }

          $ninja = "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja"
          if (Test-Path "$ninja\ninja.exe") { $ninja >> $env:GITHUB_PATH }

          $clang = Join-Path $vs 'VC\Tools\Llvm\x64\bin\clang-cl.exe'
          if (-not (Test-Path $clang)) { $clang = (Get-Command clang-cl).Source }
          & $clang --version | Select-Object -First 1
          "clang=$($clang -replace '\\', '/')" >> $env:GITHUB_OUTPUT

      - name: Cache build directory
        uses: actions/cache@v6
        with:
          path: build
          key: build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: Configure
        shell: pwsh
        env:
          CLANG: ${{ steps.msvc.outputs.clang }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $cmakeArgs = @(
            '-S', '.', '-B', 'build', '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release',
            "-DCMAKE_C_COMPILER=$env:CLANG",
            "-DCMAKE_CXX_COMPILER=$env:CLANG"
          )
          if ($env:VERSION) { $cmakeArgs += "-DGITTOOLS_VERSION=$env:VERSION" }
          cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: cmake --build build

      - name: Check version stamp
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $exe = 'build\gittools.exe'
          $reported = (& $exe --version | Out-String).Trim()
          $info = (Get-Item $exe).VersionInfo
          Write-Host "gittools --version : $reported"
          Write-Host "FileVersion        : $($info.FileVersion)"
          Write-Host "ProductVersion     : $($info.ProductVersion)"
          if ($env:VERSION) {
            if ($reported -ne "gittools $env:VERSION") {
              throw "--version printed '$reported', expected 'gittools $env:VERSION'"
            }
            if ($info.ProductVersion -ne $env:VERSION) {
              throw "ProductVersion is '$($info.ProductVersion)', expected '$env:VERSION'"
            }
          }

      - uses: actions/upload-artifact@v7
        with:
          path: build/gittools.exe
          archive: false
          if-no-files-found: error

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: |
          version=''
          if [ '${{ github.ref_type }}' = 'tag' ]; then
            version='${{ github.ref_name }}'
            version="${version#[vV]}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config libgtk-3-dev zlib1g-dev

      - name: Cache build directory
        uses: actions/cache@v6
        with:
          path: build
          key: build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: Configure
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          args=(-S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release)
          if [ -n "$VERSION" ]; then args+=("-DGITTOOLS_VERSION=$VERSION"); fi
          cmake "${args[@]}"

      - name: Build
        run: cmake --build build

      - name: Check version stamp
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          reported="$(./build/gittools --version)"
          echo "gittools --version : $reported"
          if [ -n "$VERSION" ] && [ "$reported" != "gittools $VERSION" ]; then
            echo "--version printed '$reported', expected 'gittools $VERSION'" >&2
            exit 1
          fi

      - name: Name artifact
        run: cp build/gittools gittools-linux-x86_64

      - uses: actions/upload-artifact@v7
        with:
          path: gittools-linux-x86_64
          archive: false
          if-no-files-found: error

  release:
    needs: [build, build-linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gittools.exe
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: gittools-linux-x86_64
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          assets=()
          for name in gittools.exe gittools-linux-x86_64; do
            asset=$(find dist -type f -name "$name" | head -n 1)
            if [ -z "$asset" ]; then
              echo "$name not found in the downloaded artifacts" >&2
              exit 1
            fi
            assets+=("$asset")
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            flags=()
            case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$TAG" "${assets[@]}" \
              --verify-tag \
              --title "gittools $VERSION" \
              --generate-notes \
              "${flags[@]}"
          fi
